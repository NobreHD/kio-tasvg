name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: dnf install -y gcc-c++ cmake extra-cmake-modules kf6-kio-devel kf6-karchive-devel kf6-kconfig-devel qt6-qtsvg-devel rpm-build
      - name: Build & Package
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cd build && cpack -G "RPM;TGZ"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/*.rpm
            build/*.tar.gz

  build-deb:
    runs-on: ubuntu-latest
    container: debian:testing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential dpkg-dev file cmake extra-cmake-modules libkf6kio-dev libkf6archive-dev libkf6config-dev libqt6svg6-dev
      - name: Build & Package
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          cd build && cpack -G DEB
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/*.deb